name: Publish MCP Registry Entry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag matching the checked-out release metadata.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate committed release version
        run: bun run scripts/release-version-validator.ts "${{ inputs.release_tag }}"
      - name: Verify published npm package version
        run: |
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          test "$(npm view "@hiai-gg/docsmint@${VERSION}" version)" = "$VERSION"
      - name: Install pinned MCP publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          install /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - run: mcp-publisher validate server.json
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
