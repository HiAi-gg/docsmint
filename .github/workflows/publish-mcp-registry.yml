name: Publish MCP Registry Entry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned MCP publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          install /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - run: mcp-publisher validate server.json
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
