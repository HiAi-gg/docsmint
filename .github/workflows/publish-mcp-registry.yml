name: Publish MCP Registry Entry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag matching the checked-out release metadata.
        required: true
        type: string
      release_commit:
        description: Exact 40-character commit SHA resolved by the release tag.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NPM_EVIDENCE_DIRECTORY: build/release-evidence/npm-provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify exact tag commit and npm provenance
        run: |
          set -euo pipefail
          test "$RELEASE_COMMIT" = "$(printf '%s' "$RELEASE_COMMIT" | tr '[:upper:]' '[:lower:]')"
          test "${#RELEASE_COMMIT}" -eq 40
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          bun run scripts/release-version-validator.ts "$RELEASE_TAG"
          RELEASE_VERSION="${RELEASE_TAG#v}" bun run scripts/verify-published-package.ts
      - name: Upload commit-bound npm provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: manual-mcp-npm-provenance-${{ inputs.release_commit }}
          path: build/release-evidence/npm-provenance/
          if-no-files-found: error
      - name: Install pinned MCP publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          install /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - run: mcp-publisher validate server.json
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
