name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions; jobs that need more request them explicitly
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint — Biome 2.4.15 (configured in root biome.json)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Configure workspaces for CI
        run: |
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.workspaces = pkg.workspaces.filter(w => !w.includes('hiai-ui'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies['@hiai-gg/hiai-ui']) {
              pkg.dependencies['@hiai-gg/hiai-ui'] = '^0.0.8';
            }
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2));
          "
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ---------------------------------------------------------------------------
  # 2. Typecheck — `bun run typecheck` (root)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Configure workspaces for CI
        run: |
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.workspaces = pkg.workspaces.filter(w => !w.includes('hiai-ui'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies['@hiai-gg/hiai-ui']) {
              pkg.dependencies['@hiai-gg/hiai-ui'] = '^0.0.8';
            }
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2));
          "
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # ---------------------------------------------------------------------------
  # 3. Hermetic unit and contract tests — no service URLs or containers
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: test-secret-key-minimum-32-chars-long
      BETTER_AUTH_URL: http://localhost:50700
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Configure workspaces for CI
        run: |
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.workspaces = pkg.workspaces.filter(w => !w.includes('hiai-ui'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies['@hiai-gg/hiai-ui']) {
              pkg.dependencies['@hiai-gg/hiai-ui'] = '^0.0.8';
            }
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2));
          "
      - run: bun install --frozen-lockfile
      - run: bun run release:check:audit
      - run: bun run test:unit
      - run: bun run test:contract

  integration-test:
    name: Required PostgreSQL Integrations
    runs-on: ubuntu-latest
    env:
      PIPELINE_RLS_TEST_DATABASE_URL: postgresql://aiuser:testpassword@localhost:5432/hiai_docs_test
      LIFECYCLE_TEST_DATABASE_URL: postgresql://aiuser:testpassword@localhost:5432/hiai_docs_test
      CONTENT_ACCESS_TEST_DATABASE_URL: postgresql://aiuser:testpassword@localhost:5432/hiai_docs_test
      DOCSMINT_CONTRACT_DATABASE_URL: postgresql://aiuser:testpassword@localhost:5432/hiai_docs_test
      DATABASE_URL: postgresql://aiuser:testpassword@localhost:5432/hiai_docs_test
      REDIS_URL: redis://127.0.0.1:6384/0
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Configure workspaces for CI
        run: |
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.workspaces = pkg.workspaces.filter(w => !w.includes('hiai-ui'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies['@hiai-gg/hiai-ui']) {
              pkg.dependencies['@hiai-gg/hiai-ui'] = '^0.0.8';
            }
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2));
          "
      - run: bun install --frozen-lockfile

      - name: Build custom Postgres image
        run: docker build -t hiai-postgres:18-custom ./postgres

      - name: Start custom Postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_DB=hiai_docs_test \
            -e POSTGRES_USER=aiuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e HIAI_APP_PASSWORD=test-runtime-password \
            -p 5432:5432 \
            hiai-postgres:18-custom
          # Wait for ready
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U aiuser -d hiai_docs_test; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to start"
          docker logs postgres
          exit 1

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6384:6379 redis:8-alpine
          for i in $(seq 1 15); do
            if docker exec redis redis-cli ping | grep PONG; then
              echo "Redis ready"
              exit 0
            fi
            sleep 1
          done
          echo "Redis failed to start"
          docker logs redis
          exit 1

      - run: cd packages/db && bun run db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://aiuser:testpassword@localhost:5432/hiai_docs_test

      - name: Run required integrations with zero skips
        shell: bash
        run: |
          set -euo pipefail
          bun run test:integration 2>&1 | tee /tmp/docsmint-required-integrations.log
          for suite in \
            "pipeline tenant RLS integration" \
            "lifecycle operation persistence integration" \
            "re-embed delete parent-row lock integration" \
            "embedding context migration integration" \
            "recursive folder category resolution executes on PostgreSQL" \
            "occupied replay keys distinguish authorized replay from a non-disclosing conflict" \
            "authorizes grandparent-inherited category documents and excludes foreign graph IDs" \
            "finds direct and two-level effective-category documents in owner and workspace tenants" \
            "holds deterministic descendant locks through the document snapshot" \
            "keeps concurrent observers isolated and preserves client ownership" \
            "contains observer failures and never exposes query parameters" \
            "does not install PostgreSQL debug instrumentation unless requested" \
            "PUT write-hold keeps cleanup unclaimable until storage write activation" \
            "workspace duplicate quota exhaustion rejects before copied attachments exist" \
            "confirm lease blocks expired-upload cleanup from deleting the object" \
            "account purge pages attachments beyond the cleanup batch size" \
            "restore and hard purge serialize on the document pipeline lock without deadlock" \
            "terminal quota rejection retires cleanup instead of retrying forever" \
            "rejected-confirm exact drain ignores a backlog larger than one page" \
            "account purge and attachment mutation serialize without deadlock"; do
            grep --fixed-strings "$suite" /tmp/docsmint-required-integrations.log >/dev/null
          done
          if grep -Eq '\(skip\)|[1-9][0-9]* skip' /tmp/docsmint-required-integrations.log; then
            echo "Required integration suite reported skipped coverage"
            exit 1
          fi
          echo "Required integration behavior cases: 26; skipped: 0"

      - name: Stop Postgres
        if: always()
        run: docker rm --force postgres redis || true

  build:
    name: Build Every Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --sequential --filter '*' build

  # ---------------------------------------------------------------------------
  # 4. Docker build — validate compose, build both images, security scan
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DB_PASSWORD: ci-database-password
      HIAI_APP_PASSWORD: ci-runtime-password
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-characters
      CSRF_SECRET: ci-csrf-secret-32-characters-long
      STORAGE_SECRET_KEY: ci-storage-secret-32-characters-long
      STORAGE_INTERNAL_ENDPOINT_URL: http://seaweedfs:8333
      STORAGE_PUBLIC_ENDPOINT_URL: https://storage.release.invalid
      WEBHOOK_SECRET: ci-webhook-secret-32-characters-long
      HIAI_DOCS_API_KEY: ci-admin-api-key-non-placeholder
      API_KEY_ENCRYPTION_SECRET: ci-api-key-encryption-secret-32-chars
      OWNER_ID: 00000000-0000-4000-8000-000000000700
      GRAPH_EXTRACT_ENABLED: 'false'
      GRAPH_SEARCH_ENABLED: 'false'
      RELEASE_COMMIT: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: docsmint-release-docker-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_DOCKER_EVIDENCE_DIRECTORY: build/release-evidence/docker-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Configure workspaces for CI
        run: |
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.workspaces = pkg.workspaces.filter(w => !w.includes('hiai-ui'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies['@hiai-gg/hiai-ui']) {
              pkg.dependencies['@hiai-gg/hiai-ui'] = '^0.0.8';
            }
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2));
          "

      # A) Validate docker-compose.yml — catches bad interpolations & schema errors
      - name: Validate docker compose
        run: docker compose --env-file /dev/null config --quiet

      - name: Validate canonical container ports
        run: sh scripts/check-compose-port-contract.sh

      # B) Set up buildx with GitHub Actions cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # C) Build the backend image (root context, dockerfile: backend/Dockerfile)
      - name: Build backend image (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          tags: hiai-docs/api:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=hiai-docs-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # D) Build the frontend image (root context, dockerfile: frontend/Dockerfile)
      - name: Build frontend image (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            PUBLIC_APP_ID=docsmint
            PUBLIC_DEPLOYMENT_ID=ci-${{ github.sha }}
          tags: hiai-docs/web:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=hiai-docs-web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # E) Build the Caddy release image as well; it is part of the supported
      # deployment contour even though it does not run an application test.
      - name: Build Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          tags: hiai-docs/caddy:ci-${{ github.sha }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # E) Smoke test — require healthy dependencies and a successful health response
      - name: Smoke test backend image against healthy services
        shell: bash
        run: |
          set -euo pipefail
          docker tag hiai-docs/api:ci-${{ github.sha }} docsmint-api:local
          docker tag hiai-docs/web:ci-${{ github.sha }} docsmint-web:local
          bun run release:check:docker-smoke
          curl --fail --silent --show-error http://127.0.0.1:50700/api/health
          curl --fail --silent --show-error http://127.0.0.1:50701/login >/dev/null

      - name: Upload commit-bound Docker smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-docker-smoke-docker-build-${{ github.sha }}
          path: build/release-evidence/docker-smoke/
          if-no-files-found: error

      - name: Collect smoke logs and stop services
        if: always()
        run: |
          docker compose --env-file /dev/null ps --all || true
          docker compose --env-file /dev/null logs --no-color api migrate postgres redis seaweedfs || true
          docker compose --env-file /dev/null down --volumes --remove-orphans || true

      # F) Security scan — Trivy (preferred; Docker Scout as fallback)
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: hiai-docs/api:ci-${{ github.sha }}
          format: 'sarif'
          exit-code: '0' # warn-only on PRs; tighten to "1" on protected branches
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-api.sarif'
      - name: Upload Trivy SARIF (backend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Security scan frontend with Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: hiai-docs/web:ci-${{ github.sha }}
          format: 'sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-web.sarif'
      - name: Upload Trivy SARIF (frontend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Enforce fixable critical backend vulnerabilities on tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: hiai-docs/api:ci-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Enforce fixable critical frontend vulnerabilities on tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: hiai-docs/web:ci-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # G) Finalise cache (atomic swap)
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ---------------------------------------------------------------------------
  # 5. Clean consumer — verify the published package surface, including bins
  # ---------------------------------------------------------------------------
  package-consumer:
    name: Clean Bun Consumer
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install and build SDK
        run: |
          bun install --frozen-lockfile
          cd packages/sdk && bun run build && bun run typecheck
          cd ../cli && bun run typecheck
          cd ../mcp-server && bun run typecheck
      - name: Verify complete packed consumer contract
        run: bun run scripts/verify-packed-package.ts
      - name: Install tarball in a clean Bun consumer
        run: bash scripts/test-public-package-consumer.sh

  release-static-gates:
    name: Frozen Install, Security, Version, Workflow, and Evidence
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun run release:check:clean
      - run: bun install --frozen-lockfile
      - run: bun run release:check:audit
      - run: bun run release:check:secrets
      - run: bun run scripts/release-version-validator.ts "${{ github.ref_name }}"
      - run: bun run release:check:workflow
      - name: Reject incomplete contract or SaaS migration evidence
        run: bun run release:check:contract-evidence

  scoped-live-integration:
    name: Required Live REST, SDK, Search, and MCP Contract
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-live-db-password
      HIAI_APP_PASSWORD: ci-live-runtime-password
      DATABASE_URL: postgresql://hiai_app:ci-live-runtime-password@127.0.0.1:5437/hiai_docs
      DOCSMINT_CONTRACT_DATABASE_URL: postgresql://hiai_app:ci-live-runtime-password@127.0.0.1:5437/hiai_docs
      PIPELINE_RLS_TEST_DATABASE_URL: postgresql://aiuser:ci-live-db-password@127.0.0.1:5437/hiai_docs
      LIFECYCLE_TEST_DATABASE_URL: postgresql://aiuser:ci-live-db-password@127.0.0.1:5437/hiai_docs
      API_PORT: '50710'
      DOCSMINT_CONTRACT_BASE_URL: http://127.0.0.1:50710
      BETTER_AUTH_URL: http://127.0.0.1:50710
      REDIS_URL: redis://127.0.0.1:6384/13
      DOCSMINT_CONTRACT_REDIS_URL: redis://127.0.0.1:6384/13
      STORAGE_ENDPOINT: 127.0.0.1
      STORAGE_PORT: '50702'
      STORAGE_INTERNAL_ENDPOINT_URL: http://127.0.0.1:50702
      STORAGE_PUBLIC_ENDPOINT_URL: http://127.0.0.1:50702
      DOCSMINT_CONTRACT_STORAGE_URL: http://127.0.0.1:50702
      STORAGE_ACCESS_KEY: hiai-docs
      STORAGE_SECRET_KEY: ci-live-storage-secret-32-characters
      STORAGE_BUCKET: hiai-docs
      STORAGE_FORCE_PATH_STYLE: 'true'
      BETTER_AUTH_SECRET: ci-live-better-auth-secret-32-characters
      CSRF_SECRET: ci-live-csrf-secret-32-characters-long
      WEBHOOK_SECRET: ci-live-webhook-secret-32-characters-long
      HIAI_DOCS_API_KEY: ci-live-admin-api-key-non-placeholder
      API_KEY_ENCRYPTION_SECRET: ci-live-api-key-encryption-secret-32-chars
      OWNER_ID: 00000000-0000-4000-8000-000000000700
      DOCSMINT_WORKSPACE_ENABLED: 'true'
      DOCSMINT_WORKSPACE_ISSUER: docsmint-release-ci
      DOCSMINT_WORKSPACE_SECRET: ci-live-workspace-secret-32-characters
      DOCSMINT_CONTRACT_EMBEDDING_URL: http://127.0.0.1:50711/v1
      EMBEDDING_BASE_URL: http://127.0.0.1:50711/v1
      EMBEDDING_API_KEY: ci-live-embedding-fixture-key
      EMBEDDING_MODEL: task2-contract-embedding
      GRAPH_EXTRACT_ENABLED: 'false'
      GRAPH_SEARCH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Start isolated required services and migrations
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null up --detach --wait postgres redis seaweedfs
          docker compose --env-file /dev/null run --rm --no-deps migrate
          docker compose --env-file /dev/null ps --all
      - run: bun run test:contract:scoped-live
      - name: Collect live-contract logs and stop services
        if: always()
        run: |
          docker compose --env-file /dev/null logs --no-color migrate postgres redis seaweedfs || true
          docker compose --env-file /dev/null down --volumes --remove-orphans || true

  browser-e2e:
    name: Agent Browser Lightpanda Desktop and Mobile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-browser-database-password
      HIAI_APP_PASSWORD: ci-browser-runtime-password
      BETTER_AUTH_SECRET: ci-browser-better-auth-secret-32-characters
      CSRF_SECRET: ci-browser-csrf-secret-32-characters
      STORAGE_SECRET_KEY: ci-browser-storage-secret-32-characters
      STORAGE_INTERNAL_ENDPOINT_URL: http://seaweedfs:8333
      STORAGE_PUBLIC_ENDPOINT_URL: https://storage.release.invalid
      WEBHOOK_SECRET: ci-browser-webhook-secret-32-characters
      HIAI_DOCS_API_KEY: ci-browser-admin-api-key-non-placeholder
      API_KEY_ENCRYPTION_SECRET: ci-browser-api-key-encryption-secret-32-chars
      OWNER_ID: 00000000-0000-4000-8000-000000000700
      GRAPH_EXTRACT_ENABLED: 'false'
      GRAPH_SEARCH_ENABLED: 'false'
      AGENT_BROWSER_ENGINE: lightpanda
      LIGHTPANDA_DISABLE_TELEMETRY: 'true'
      RELEASE_COMMIT: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: docsmint-release-browser-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_DOCKER_EVIDENCE_DIRECTORY: build/release-evidence/docker-smoke
      RELEASE_EVIDENCE_DIRECTORY: build/release-evidence/browser
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Install pinned agent-browser without Chrome
        run: bun add --global agent-browser@0.34.0
      - name: Install pinned Lightpanda release
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lightpanda-io/browser/releases/download/0.3.7/lightpanda-x86_64-linux \
            --output "${RUNNER_TEMP}/lightpanda"
          chmod +x "${RUNNER_TEMP}/lightpanda"
          sudo install "${RUNNER_TEMP}/lightpanda" /usr/local/bin/lightpanda
          lightpanda version
      - name: Rebuild and start the complete release stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null build
          bun run release:check:docker-smoke
          curl --fail --silent --show-error http://127.0.0.1:50700/api/health
          curl --fail --silent --show-error http://127.0.0.1:50701/login >/dev/null
      - run: bun run release:check:browser
      - name: Upload commit-bound Docker smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-docker-smoke-browser-e2e-${{ github.sha }}
          path: build/release-evidence/docker-smoke/
          if-no-files-found: error
      - name: Upload commit-bound browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-e2e-${{ github.sha }}
          path: build/release-evidence/browser/
          if-no-files-found: error
      - name: Collect browser stack logs and stop services
        if: always()
        run: |
          docker compose --env-file /dev/null ps --all || true
          docker compose --env-file /dev/null logs --no-color api web migrate postgres redis seaweedfs || true
          docker compose --env-file /dev/null down --volumes --remove-orphans || true

  release-tag-gate:
    name: Complete Tag Release Gate
    needs: [lint, typecheck, unit-test, integration-test, scoped-live-integration, build, package-consumer, docker-build, browser-e2e, release-static-gates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun run release:write:gate-result
      - uses: actions/upload-artifact@v4
        with:
          name: release-tag-gate-${{ github.sha }}
          path: build/release-evidence/release-tag-gate.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 6. Publish Docker — runs only after every verification job passes
  # ---------------------------------------------------------------------------
  publish-docker:
    name: Publish Docker Images
    needs: [release-tag-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Validate committed release version
        run: bun run scripts/release-version-validator.ts "${{ github.ref_name }}"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Rebuild and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/hiai-gg/docsmint-api:${{ github.ref_name }}
            ghcr.io/hiai-gg/docsmint-api:latest
            vgalibov/docsmint:api-${{ github.ref_name }}
            vgalibov/docsmint:api-latest
      - name: Rebuild and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            PUBLIC_APP_ID=docsmint
            PUBLIC_DEPLOYMENT_ID=docsmint-oss-0.7.0
          push: true
          tags: |
            ghcr.io/hiai-gg/docsmint-web:${{ github.ref_name }}
            ghcr.io/hiai-gg/docsmint-web:latest
            vgalibov/docsmint:web-${{ github.ref_name }}
            vgalibov/docsmint:web-latest
      - name: Rebuild and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: |
            ghcr.io/hiai-gg/docsmint-caddy:${{ github.ref_name }}
            ghcr.io/hiai-gg/docsmint-caddy:latest
            vgalibov/docsmint:caddy-${{ github.ref_name }}
            vgalibov/docsmint:caddy-latest

  # ---------------------------------------------------------------------------
  # 7. Publish NPM — publish package `@hiai-gg/docsmint` to NPM (Tokenless OIDC)
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish NPM Package
    needs: [release-tag-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Validate committed release version
        run: bun run scripts/release-version-validator.ts "${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing (tokenless) requires npm >= 11.5.1.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # sigstore is required by npm for --provenance flag in trusted publishing
      - name: Install sigstore for npm provenance
        run: npm install -g sigstore

      - name: Configure workspaces for CI
        run: |
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.workspaces = pkg.workspaces.filter(w => !w.includes('hiai-ui'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies['@hiai-gg/hiai-ui']) {
              pkg.dependencies['@hiai-gg/hiai-ui'] = '^0.0.8';
            }
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        # The published tarball ships packages/sdk/dist/*. CI uses --ignore-scripts
        # at publish time, so prepublishOnly does not run. Build it explicitly here
        # to guarantee the dist/ artifacts exist before `npm publish`.
        run: cd packages/sdk && bun run build

      - name: Prepare committed public package.json
        run: |
          # Publish the committed public manifest only after the release gate has
          # established that its version already equals the signed tag.
          cp package.public.json package.json

      - name: Stage public package artifacts
        run: |
          rm -rf dist
          cp -R packages/sdk/dist dist

      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@hiai-gg/docsmint@${version}" version >/dev/null 2>&1; then
            echo "::notice::@hiai-gg/docsmint@${version} already on npm — skipping."
          else
            npm publish --access public --provenance --ignore-scripts
          fi

  # ---------------------------------------------------------------------------
  # 8. Verify the exact published npm artifact belongs to this tag commit
  # ---------------------------------------------------------------------------
  verify-npm-provenance:
    name: Verify Published NPM Provenance
    needs: [publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_NPM_EVIDENCE_DIRECTORY: build/release-evidence/npm-provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify exact tag commit and npm provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          RELEASE_VERSION="${RELEASE_TAG#v}" bun run scripts/verify-published-package.ts
      - name: Upload commit-bound npm provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-npm-provenance-${{ github.sha }}
          path: build/release-evidence/npm-provenance/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 9. Publish MCP Registry — verify GitHub namespace ownership with OIDC
  # ---------------------------------------------------------------------------
  publish-mcp-registry:
    name: Publish Official MCP Registry Entry
    needs: [verify-npm-provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Validate committed release version
        run: bun run scripts/release-version-validator.ts "${{ github.ref_name }}"
      - name: Install pinned MCP publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          install /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - name: Validate registry manifest
        run: mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish registry manifest
        run: mcp-publisher publish

  # ---------------------------------------------------------------------------
  # 10. GitHub Release — created only after every publication succeeds
  # ---------------------------------------------------------------------------
  create-github-release:
    name: Create GitHub Release
    needs: [publish-docker, verify-npm-provenance, publish-mcp-registry]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists — updating its title."
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DocsMint v${version}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DocsMint v${version}" \
              --generate-notes
          fi
