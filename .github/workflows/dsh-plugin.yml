name: dsh-plugin
on:
  pull_request:
    paths: ['packages/dsh-plugin/**', '.github/workflows/dsh-plugin.yml', '.github/scripts/dsh-mirror.sh']
  push:
    branches: [main]
    paths: ['packages/dsh-plugin/**', '.github/workflows/dsh-plugin.yml', '.github/scripts/dsh-mirror.sh']
    tags: ['dsh-plugin-v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/dsh-plugin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Install and verify packed archive
        run: |
          PACK_DIR="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          cd "$PACK_DIR"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$PACK_DIR"/*.tgz
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const name = '@hiai-gg/dsh-docsmint'
          const entry = require.resolve(name)
          assert.equal(typeof (await import(name)).apply, 'function')
          for (const subpath of ['client', 'icon',
            'assets/docsmint-mark.svg', 'assets/docsmint-mark-dark.svg',
            'assets/docsmint-mark-mono.svg', 'locale/en.json', 'locale/ru.json']) {
            const file = require.resolve(name + '/' + subpath)
            assert.ok((await readFile(file)).length > 0, subpath)
          }
          const root = new URL('.', 'file://' + entry)
          const manifest = JSON.parse(await readFile(new URL('package.json', root), 'utf8'))
          assert.equal(manifest.name, name)
          assert.ok((await readFile(new URL(manifest.dsh.bundle.patch, root), 'utf8')).includes(name))
          console.log('Packed installation, host import, client, locales, icon and brand assets verified')
          NODE
  publish:
    if: startsWith(github.ref, 'refs/tags/dsh-plugin-v')
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: dsh-plugin-npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/dsh-plugin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - name: Package and publish plugin
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "dsh-plugin-v$VERSION"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/dsh-pack.json"
          TARBALL="$(node -p "require(process.env.RUNNER_TEMP + '/dsh-pack.json')[0].filename")"
          EXPECTED_INTEGRITY="$(node -p "require(process.env.RUNNER_TEMP + '/dsh-pack.json')[0].integrity")"
          EXISTING_INTEGRITY="$(npm view "@hiai-gg/dsh-docsmint@$VERSION" dist.integrity --prefer-online 2>/dev/null || true)"
          if [[ -n "$EXISTING_INTEGRITY" ]]; then
            test "$EXISTING_INTEGRITY" = "$EXPECTED_INTEGRITY"
            echo "Identical immutable version already exists; verifying without republishing"
          else
            npm publish "$TARBALL" --ignore-scripts --access public --provenance --tag "$DIST_TAG"
          fi
          printf 'PLUGIN_VERSION=%s\nPLUGIN_TARBALL=%s\nPLUGIN_DIST_TAG=%s\n' "$VERSION" "$TARBALL" "$DIST_TAG" >> "$GITHUB_ENV"
      - name: Verify registry artifact and provenance
        run: |
          set -euo pipefail
          # npm metadata can lag a successful publish. Retry reads, never the write.
          for ATTEMPT in {1..12}; do
            if npm view "@hiai-gg/dsh-docsmint@$PLUGIN_VERSION" --prefer-online --json > "$RUNNER_TEMP/dsh-published.json"; then
              break
            fi
            if [[ "$ATTEMPT" == 12 ]]; then exit 1; fi
            sleep 5
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          const packed = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/dsh-pack.json', 'utf8'))[0]
          const published = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/dsh-published.json', 'utf8'))
          assert.equal(published.version, process.env.PLUGIN_VERSION)
          assert.equal(published.dist.integrity, packed.integrity)
          assert.ok(published.dist.attestations?.provenance, 'npm provenance is required')
          console.log('Published version, tarball integrity and npm provenance verified')
          NODE
      - name: Create plugin GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const changelog = await readFile('CHANGELOG.md', 'utf8')
          const section = changelog.split('\n## ').find(part => part.startsWith('[' + process.env.PLUGIN_VERSION + ']'))
          if (!section) throw new Error('Missing plugin release notes')
          await writeFile(process.env.RUNNER_TEMP + '/dsh-release-notes.md', '## ' + section)
          NODE
          FLAGS=()
          if [[ "$PLUGIN_VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Plugin GitHub release already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$PLUGIN_TARBALL" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "DSH DocsMint $PLUGIN_VERSION" \
            --notes-file "$RUNNER_TEMP/dsh-release-notes.md" "${FLAGS[@]}"

  mirror:
    name: Synchronize package-root catalog mirror
    needs: [test, publish]
    if: >-
      always() && needs.test.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       (startsWith(github.ref, 'refs/tags/dsh-plugin-v') && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    concurrency:
      group: dsh-plugin-mirror
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Split, synchronize and verify mirror
        env:
          DSH_MIRROR_SSH_KEY: ${{ secrets.DSH_MIRROR_SSH_KEY }}
        run: bash .github/scripts/dsh-mirror.sh
