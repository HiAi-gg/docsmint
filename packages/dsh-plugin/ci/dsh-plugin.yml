name: dsh-plugin
on:
  pull_request:
    paths: ['packages/dsh-plugin/**', '.github/workflows/dsh-plugin.yml']
  push:
    branches: [main]
    paths: ['packages/dsh-plugin/**', '.github/workflows/dsh-plugin.yml']
    tags: ['dsh-plugin-v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/dsh-plugin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Install and verify packed archive
        run: |
          PACK_DIR="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          cd "$PACK_DIR"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$PACK_DIR"/*.tgz
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const name = '@hiai-gg/dsh-docsmint'
          const entry = require.resolve(name)
          assert.equal(typeof (await import(name)).apply, 'function')
          for (const subpath of ['client', 'icon',
            'assets/docsmint-mark.svg', 'assets/docsmint-mark-dark.svg',
            'assets/docsmint-mark-mono.svg', 'locale/en-US.json', 'locale/ru-RU.json']) {
            const file = require.resolve(name + '/' + subpath)
            assert.ok((await readFile(file)).length > 0, subpath)
          }
          const root = new URL('.', 'file://' + entry)
          const manifest = JSON.parse(await readFile(new URL('package.json', root), 'utf8'))
          assert.equal(manifest.name, name)
          assert.ok((await readFile(new URL(manifest.dsh.bundle.patch, root), 'utf8')).includes(name))
          console.log('Packed installation, host import, client, locales, icon and brand assets verified')
          NODE
  publish:
    if: startsWith(github.ref, 'refs/tags/dsh-plugin-v')
    needs: test
    runs-on: ubuntu-latest
    concurrency: dsh-plugin-npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dsh-plugin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - name: Publish plugin
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "dsh-plugin-v$VERSION"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG"
